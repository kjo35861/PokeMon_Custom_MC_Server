<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포켓메이트 로고 색상 비교</title>
<link rel="stylesheet" href="../fonts.css">
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#e5e7e3;font-family:NanumSquareRound,sans-serif;color:#283239}h1{font-size:22px;margin:0 0 12px}body>p{font-size:14px;margin-bottom:24px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{padding:28px;border-radius:16px;min-width:0;border:1px solid #7c887933}.light{background:#f6f7f3;color:#283239}.dark{background:#111c22;color:#edf2e8}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;object-fit:contain}.brand b{font-size:18px;letter-spacing:1px}.brand small{display:block;font-size:9px;letter-spacing:1.5px;margin-top:6px;opacity:.65}.large{display:block;width:180px;height:180px;object-fit:contain;margin:40px auto}.label{font-size:12px;opacity:.7}button{font:inherit;font-size:13px;border:1px solid #889b8940;border-radius:8px;padding:9px 12px;background:#b7d6c030;color:inherit;cursor:pointer;margin-top:16px}@media(max-width:650px){body{padding:18px}.panels{grid-template-columns:1fr}.large{margin:24px auto}}</style>
<h1>포켓메이트 공통 로고</h1><p>같은 투명 PNG를 밝은 배경과 어두운 배경에 놓았습니다. 상단 아이콘은 메뉴와 같은 44px입니다.</p>
<div class="panels"><section class="panel light"><p class="label">라이트 배경</p><div class="brand"><img src="../pocketmate-mark.png" alt="포켓메이트 로고"><div><b>POCKETMATE</b><small>PLAYER TERMINAL / 02</small></div></div><img class="large" src="../pocketmate-mark.png" alt="확대한 로고"></section><section class="panel dark"><p class="label">다크 배경</p><div class="brand"><img src="../pocketmate-mark.png" alt="포켓메이트 로고"><div><b>POCKETMATE</b><small>PLAYER TERMINAL / 02</small></div></div><img class="large" src="../pocketmate-mark.png" alt="확대한 로고"></section></div>
<button onclick="document.querySelectorAll('.brand img').forEach(i=>{const s=i.style.width==='32px'?'44px':'32px';i.style.width=s;i.style.height=s;});this.textContent=this.textContent.includes('32')?'44px로 보기':'32px로 보기'">32px로 보기</button>
</html>
